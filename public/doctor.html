<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Dashboard - CareWell Hospital</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head><body class="admin-body">
<div class="toast-container position-fixed top-0 end-0 p-3" id="toasts" style="z-index:2000"></div>
<header class="topbar">
  <div><h5 class="mb-0"><i class="bi bi-heart-pulse-fill text-teal me-2"></i>CareWell Doctor Portal</h5><small class="text-muted" id="todayText"></small></div>
  <div class="d-flex align-items-center gap-3">
    <a href="/" class="btn btn-sm btn-outline-secondary">Website</a>
    <button class="btn btn-sm btn-outline-danger" id="logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
  </div>
</header>

<main class="container py-4">
  <div class="panel mb-4" id="profile"><div class="text-muted">Loading profile...</div></div>
  <div class="row g-3 mb-4" id="stats"></div>
  <div class="panel">
    <ul class="nav nav-pills mb-3" id="tabs">
      <li class="nav-item"><button class="nav-link active" data-tab="today">Today</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="upcoming">Upcoming</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="history">History</button></li>
    </ul>
    <div class="table-responsive"><table class="table table-hover align-middle mb-0">
      <thead><tr><th>Date &amp; Time</th><th>Patient</th><th>Contact</th><th>Reason</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/doctor.js"></script>
</body></html>

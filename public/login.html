<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - CareWell Hospital</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head><body>
<div id="site-nav"></div>
<main class="container my-5" style="max-width:460px">
  <div class="card shadow-soft"><div class="card-body p-4">
    <div class="text-center mb-3">
      <span class="avatar mx-auto" style="width:64px;height:64px;font-size:1.6rem"><i class="bi bi-person-heart" id="roleIcon"></i></span>
      <h4 class="mt-3 mb-0" id="roleTitle">Patient Login</h4>
      <small class="text-muted" id="roleHint"></small>
    </div>
    <ul class="nav nav-pills nav-fill mb-3" id="roleTabs">
      <li class="nav-item"><button class="nav-link active" data-role="patient">Patient</button></li>
      <li class="nav-item"><button class="nav-link" data-role="doctor">Doctor</button></li>
      <li class="nav-item"><button class="nav-link" data-role="admin">Admin</button></li>
    </ul>
    <div id="alert"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-control" required autocomplete="username">
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="togglePw" title="Show / hide"><i class="bi bi-eye"></i></button>
          <div class="invalid-feedback">Enter your password.</div>
        </div>
      </div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="text-center small mt-3 mb-0" id="registerRow">New patient? <a href="/register.html">Create an account</a></p>
  </div></div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/login.js"></script>
</body></html>
